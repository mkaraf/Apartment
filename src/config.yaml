site:
  name: 'NÁZEV APARTMÁNU' # TODO: real apartment name
  site: 'https://moje-domena.cz' # TODO: real domain
  base: '/'
  trailingSlash: false

  googleSiteVerificationId: '' # TODO: Google Search Console verification ID (optional)

# Default SEO metadata
metadata:
  title:
    default: 'NÁZEV APARTMÁNU – apartmán k pronájmu ve Zlínském kraji'
    template: '%s – NÁZEV APARTMÁNU'
  description: 'Apartmán k pronájmu ve Zlínském kraji. Vybavení, fotografie, ceny, dostupné termíny a rezervace na jednom místě.'
  robots:
    index: true
    follow: true
  openGraph:
    site_name: 'NÁZEV APARTMÁNU'
    locale: cs_CZ
    images:
      - url: '~/assets/images/og-placeholder.png' # TODO: replace with a 1200×628 photo of the apartment
        width: 1200
        height: 628
    type: website
  twitter:
    # handle: '@ucet' # TODO: set only if the apartment has an X/Twitter account
    # site: '@ucet'
    cardType: summary_large_image

i18n:
  language: cs
  textDirection: ltr

apps:
  blog:
    isEnabled: false
    postsPerPage: 8

    post:
      isEnabled: true
      permalink: '/%slug%' # Variables: %slug%, %year%, %month%, %day%, %hour%, %minute%, %second%, %category%
      robots:
        index: true

    list:
      isEnabled: true
      pathname: 'blog' # Blog main path, you can change this to "articles" (/articles)
      robots:
        index: true

    category:
      isEnabled: true
      pathname: 'category' # Category main path /category/some-category, you can change this to "group" (/group/some-category)
      robots:
        index: true

    tag:
      isEnabled: true
      pathname: 'tag' # Tag main path /tag/some-tag, you can change this to "topics" (/topics/some-category)
      robots:
        index: false

    isRelatedPostsEnabled: true
    relatedPostsCount: 4

analytics:
  vendors:
    googleAnalytics:
      id: null # or "G-XXXXXXXXXX"

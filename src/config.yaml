    index: false
    follow: false
  openGraph:
    site_name: 'NÁZEV APARTMÁNU'
    locale: cs_CZ
    images:
      - url: '~/assets/images/og-placeholder.png' # TODO: replace with a 1200×628 photo of the apartment
        width: 1200
        height: 628
